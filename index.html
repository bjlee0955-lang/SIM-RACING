<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>APEX GT3 — Mobile SimRacing Prototype</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- ===== 메인 메뉴 ===== -->
    <div id="menu" class="overlay">
      <div class="menu-panel">
        <h1 class="logo">APEX <span>GT3</span></h1>
        <p class="tagline">Mobile SimRacing Prototype</p>

        <div class="menu-section">
          <h2>차량 선택</h2>
          <div id="carSelect" class="select-row"></div>
        </div>

        <div class="menu-section">
          <h2>서킷</h2>
          <div id="trackSelect" class="select-row"></div>
        </div>

        <div class="menu-section">
          <h2>연료량</h2>
          <div id="fuelSelect" class="select-row"></div>
        </div>

        <div class="menu-section">
          <h2>타이어</h2>
          <div id="tireSelect" class="select-row"></div>
        </div>

        <div class="menu-actions">
          <button id="btnQualifying" class="btn btn-secondary">퀄리파잉 시작 (5분)</button>
          <button id="btnRace" class="btn btn-primary">레이스 시작 (5랩)</button>
        </div>

        <div class="menu-section settings-row">
          <label>조향 감도
            <input type="range" id="sensSlider" min="0.3" max="2.0" step="0.05" value="1.0" />
          </label>
          <button id="btnCalibrate" class="btn btn-ghost">자이로 캘리브레이션</button>
          <button id="btnGyroEnable" class="btn btn-ghost">자이로 권한 요청 (iOS)</button>
        </div>
      </div>
    </div>

    <!-- ===== HUD ===== -->
    <div id="hud" class="overlay hidden">
      <div class="hud-top">
        <div class="hud-box hud-lap">
          <span id="lapNow">1</span>/<span id="lapTotal">5</span>
          <small>LAP</small>
        </div>
        <div class="hud-box hud-pos">
          P<span id="posNow">1</span><small>/8</small>
        </div>
        <div class="hud-box hud-time">
          <div>CUR <span id="curTime">00:00.000</span></div>
          <div>BEST <span id="bestTime">--:--.---</span></div>
        </div>
        <div class="hud-box hud-sessiontimer hidden" id="sessionTimerBox">
          <span id="sessionTimer">05:00</span>
        </div>
      </div>

      <div class="hud-bars">
        <div class="bar-wrap">
          <label>FUEL</label>
          <div class="bar"><div id="fuelBar" class="bar-fill fuel"></div></div>
          <span id="fuelPct">100%</span>
        </div>
        <div class="bar-wrap">
          <label>TIRE</label>
          <div class="bar"><div id="tireBar" class="bar-fill tire"></div></div>
          <span id="tirePct">100%</span>
        </div>
      </div>

      <canvas id="minimap"></canvas>

      <div class="hud-bottom">
        <div class="speed-cluster">
          <div id="gearNum">N</div>
          <div class="speed-value"><span id="speedNum">0</span><small>km/h</small></div>
          <div class="rpm-bar"><div id="rpmFill" class="rpm-fill"></div></div>
        </div>

        <div class="touch-controls">
          <button id="btnCamera" class="ctrl-btn">CAM</button>
          <button id="btnBrake" class="ctrl-btn ctrl-brake">BRAKE</button>
          <button id="btnGas" class="ctrl-btn ctrl-gas">GAS</button>
        </div>
      </div>
    </div>

    <!-- ===== 결과 화면 ===== -->
    <div id="resultScreen" class="overlay hidden">
      <div class="menu-panel">
        <h1 class="logo" id="resultTitle">세션 종료</h1>
        <div id="resultBody" class="result-body"></div>
        <div class="menu-actions">
          <button id="btnBackToMenu" class="btn btn-primary">메뉴로</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
